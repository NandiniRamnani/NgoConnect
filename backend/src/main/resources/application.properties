spring.application.name=backend
server.port=8082

# ── Secrets ──────────────────────────────────────────────────────────────────
# Every credential lives in the .env file at the project root, which is gitignored.
# This line pulls it in. "optional:" means the app still starts if .env is absent
# (useful in CI or on a server that supplies real environment variables instead);
# "[.properties]" tells Spring to parse the extension-less .env as a properties file.
#
# Precedence, highest first: real OS environment variables -> .env -> the defaults
# written after the ":" in each placeholder below. So a deployment can override any
# value without touching a file, and a missing .env fails loudly on the values that
# have no default rather than starting up half-configured.
#
# Copy .env.example to .env and fill it in to get started.
#
# "file:" paths resolve against the working directory, which differs by launcher:
# `mvn spring-boot:run` runs from backend/, while VS Code's Run button runs from the
# workspace root (D:\ngoConnect). Listing both lets either one find backend/.env.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ── Database ─────────────────────────────────────────────────────────────────
# Spring Boot 4 moved the CONNECTION properties from spring.data.mongodb.* to
# spring.mongodb.*; the old names are deprecated at level=error, meaning they are
# ignored outright rather than warned about. Set spring.data.mongodb.uri here by
# mistake and the app starts happily against the default mongodb://localhost/test.
spring.mongodb.uri=${MONGODB_URI}

# MAPPING properties, by contrast, stayed under spring.data.mongodb.* in Boot 4 — so the
# line below is correct as written. It creates the indexes declared with @Indexed on the
# Wallet / WalletTransaction models at startup. Wallet.userId is unique, so this is also the database-level backstop that
# guarantees a user can never end up with two wallets. Only the wallet models declare
# indexes, so nothing else is affected by turning this on.
spring.data.mongodb.auto-index-creation=true

# Without this, Spring strips the actual error reason (e.g. "Email already registered")
# out of every error response, so the frontend only ever sees a generic status like "Conflict".
spring.web.error.include-message=always

# ── Admin portal login ───────────────────────────────────────────────────────
# Blank defaults on purpose: SecurityConfig reads these as ${ngo-admin.username:} and
# skips the built-in admin entirely when they are empty, so a deployment that forgets
# to set them ends up with no admin account rather than a guessable one.
ngo-admin.username=${NGO_ADMIN_USERNAME:}
ngo-admin.password=${NGO_ADMIN_PASSWORD:}

# ── Cloudinary (NGO document and media uploads) ──────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Razorpay ─────────────────────────────────────────────────────────────────
# key-id is safe to hand to the frontend (Checkout needs it); key-secret must never
# leave the backend — it is what signs and verifies payments.
# Get test keys at https://dashboard.razorpay.com -> Test Mode -> Settings -> API Keys.
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# A SEPARATE secret from key-secret, created alongside the webhook itself at
# dashboard.razorpay.com -> Settings -> Webhooks. It signs the webhook body so we can tell a real
# Razorpay callback from anyone who found the URL — the endpoint is necessarily public, since
# Razorpay's servers call it with no login.
#
# Blank means the webhook endpoint rejects everything (503) rather than trusting unsigned calls:
# an unconfigured secret must never degrade into "skip the check". The browser-driven verify
# endpoints keep working either way, so leaving this blank costs recovery, not payments.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ── Demo payment mode ────────────────────────────────────────────────────────
# Turns the two Razorpay round trips into a simulation that always works, for classroom demos and
# for developing without a network. The real integration code is NOT removed or replaced — it is
# the same createOrder/verify pair, with the two calls that leave the machine skipped:
#   * no Order is created at the gateway; the order id is generated locally with a "order_demo_"
#     prefix so a demo record can never be confused with a real one
#   * no signature is verified, because there is no gateway to have signed anything
# Everything after that — the PENDING row, the claim, the balance change, the NGO credit, the 80G
# receipt — runs exactly as it does in production, so what is demonstrated is the real system.
#
# Defaults to FALSE. A deployment that leaves it unset gets real payments, which is the only safe
# default: the failure mode of accidentally enabling this is accepting donations nobody paid for.
payments.demo-mode=${PAYMENT_DEMO_MODE:false}

# ── Mail (password-reset emails) ─────────────────────────────────────────────
# MAIL_PASSWORD is a Gmail App Password (16 characters, from
# https://myaccount.google.com/apppasswords) — NOT the normal account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL of the running frontend, used to build the link inside reset emails.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# How long a password-reset link stays usable, in minutes.
# A reset link is a temporary key to an account that sits in an inbox, so the window is kept
# deliberately short: long enough to read the mail and pick a new password, too short to be worth
# stealing from a forwarded thread or an unlocked phone later. The figure below is also the one
# quoted in the email itself, so the two can never disagree.
security.reset-token-minutes=${RESET_TOKEN_MINUTES:15}

# ── File upload limits (10MB per file, 40MB total request) ───────────────────
# Raised from 10MB so NGOs can upload short videos. 100MB is Cloudinary's free-plan cap per video;
# the photo and document endpoints still check their own file types.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
spring.servlet.multipart.enabled=true

# ── NGO payouts ──────────────────────────────────────────────────────────────
# How long a donation sits in the NGO's `clearing` bucket before it can be withdrawn.
# This mirrors Razorpay's settlement delay: a donation being marked PAID does not mean the
# money is in our bank account yet, and paying an NGO sooner means paying out money we do not
# hold. Set PAYOUT_CLEARING_HOURS=0 in .env to make funds withdrawable instantly for a demo.
payouts.clearing-hours=${PAYOUT_CLEARING_HOURS:48}

# How often the job that promotes cleared funds runs (milliseconds). The window is measured in
# days, so this does not need to be tight. Default 5 minutes.
payouts.clearing-job-ms=${PAYOUT_CLEARING_JOB_MS:300000}

# Withdrawals are frozen for this long after an NGO changes its payout destination, so a
# stolen login cannot redirect the balance and drain it before anyone notices.
payouts.change-cooling-off-hours=${PAYOUT_COOLING_OFF_HOURS:24}

# Smallest payout worth making a bank transfer for.
payouts.min-withdrawal-rupees=${PAYOUT_MIN_RUPEES:100}

# Who gets the "a new withdrawal is waiting" email. Blank disables it.
payouts.admin-notify-email=${PAYOUT_ADMIN_EMAIL:}
